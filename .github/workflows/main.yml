name: CI

on: [push, pull_request]

jobs:
  style:
    runs-on: ubuntu-latest
    name: Style checks

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Prettier
        run: ./node_modules/.bin/prettier --check "src/**/*.ts" "src/**/*.vue" "sass/*.scss"

  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.platform }}

    strategy:
      matrix:
        platform: ["chrome", "firefox"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: npm run ${{ matrix.platform }}
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [build]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clear Puppeteer browser cache
        run: rm -rf ~/.cache/puppeteer/chrome

      - name: Install Chrome for Puppeteer
        run: |
          BROWSER_INFO="$(npx puppeteer browsers install chrome)"
          echo "$BROWSER_INFO"
          BROWSER_PATH="$(printf '%s\n' "$BROWSER_INFO" | tail -n 1 | cut -d' ' -f2-)"
          test -x "$BROWSER_PATH"
          echo "PUPPETEER_EXEC_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Test code
        run: xvfb-run -a npm test
